[project]
name = "mambalite"
version = "0.1.0"
description = "A minimal Mamba-style selective SSM trained from scratch in NumPy"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
